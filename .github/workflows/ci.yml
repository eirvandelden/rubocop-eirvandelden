name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Ruby
        uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current
          install-gems: true

      - name: Lint code for consistent style
        run: bundle exec rubocop -f github

  test:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.3

      - name: Set up Ruby
        uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current
          install-gems: true

      - name: Check that every shared rule still applies
        run: bundle exec rake test
