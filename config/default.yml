---
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-minitest
  - rubocop-obsession
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rails
  - rubocop-rbs_inline
  - rubocop-rspec
  - rubocop-yard

AllCops:
  NewCops: enable

  Exclude:
    - '**/app/assets/**/*'
    - '**/db/schema.rb'
    - '**/log/**/*'
    - '**/node_modules/**/*'
    - '**/public/**/*'
    - '**/storage/**/*'
    - '**/templates/**/*'
    - '**/tmp/**/*'
    - '**/vendor/**/*'
    - 'bin/**/*'

# rubocop-obsession loads rubocop-rspec whenever it can. Naming the department here keeps
# these rules off in the Minitest projects that would otherwise inherit all 115 of them.
RSpec:
  Enabled: false

# A test that walks a whole user journey earns several assertions; one with a dozen is a smell.
Minitest/MultipleAssertions:
  Max: 8

Layout/LineLength:
  Enabled: true
  Max: 120

# Routes and environment files are one long block by design, and a test block's size is
# already governed by how many assertions it makes.
Metrics/BlockLength:
  Enabled: true
  Exclude:
    - '**/config/environments/*.rb'
    - '**/config/routes.rb'
    - '**/test/**/*'

# `#:` return annotations have no space after the hash by design.
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: never

Minitest/UnreachableAssertion:
  Enabled: true

Performance/BindCall:
  Enabled: true
Performance/DeletePrefix:
  Enabled: true
Performance/DeleteSuffix:
  Enabled: true
Performance/EndWith:
  Enabled: true
Performance/FlatMap:
  Enabled: true
Performance/MapCompact:
  Enabled: true
Performance/RedundantMerge:
  Enabled: true
Performance/RegexpMatch:
  Enabled: true
Performance/ReverseEach:
  Enabled: true
Performance/SelectMap:
  Enabled: true
Performance/StartWith:
  Enabled: true
Performance/StringReplacement:
  Enabled: true
Performance/UnfreezeString:
  Enabled: true

# Rails advice lives in config/rails.yml. Every one of these cops suggests an ActiveSupport
# method, so in a plain Ruby project they autocorrect into a method that does not exist.
Rails:
  Enabled: false
Obsession/Rails:
  Enabled: false

# Every file is checked for inline RBS annotations, with no magic comment. A file skips the checks
# only with `# rbs_inline: disabled`. A leftover `# rbs_inline: enabled` is flagged, and autocorrect
# removes it. Omakase switches the whole Style department off, so each cop is named. Lint demands
# a `#:` signature on public methods and `attr_*`, and a `#:` type on every Data and Struct attribute.
# The plugin skips only the root `test/` and `spec/`; the leading `**/` also skips nested ones.
Style/RbsInline:
  Mode: opt_out
  Exclude:
    - '**/spec/**/*'
    - '**/test/**/*'
Style/RbsInline/DataClassCommentAlignment:
  Enabled: true
Style/RbsInline/DataDefineWithBlock:
  Enabled: true
Style/RbsInline/EmbeddedRbsSpacing:
  Enabled: true
Style/RbsInline/InvalidComment:
  Enabled: true
Style/RbsInline/InvalidTypes:
  Enabled: true
Style/RbsInline/KeywordSeparator:
  Enabled: true
Style/RbsInline/MethodCommentSpacing:
  Enabled: true
Style/RbsInline/MissingDataClassAnnotation:
  Enabled: true
Style/RbsInline/MissingStructClassAnnotation:
  Enabled: true
Style/RbsInline/MissingTypeAnnotation:
  Enabled: true
  EnforcedStyle: method_type_signature
  Visibility: public
Style/RbsInline/ParametersSeparator:
  Enabled: true
Style/RbsInline/RedundantAnnotationWithSkip:
  Enabled: true
Style/RbsInline/RedundantInstanceVariableAnnotation:
  Enabled: true
# Keeps `#:` and removes the `# @rbs` lines beside it; the default style would delete the `#:`.
Style/RbsInline/RedundantTypeAnnotation:
  Enabled: true
  EnforcedStyle: method_type_signature
Style/RbsInline/RequireRbsInlineComment:
  Enabled: true
Style/RbsInline/StructClassCommentAlignment:
  Enabled: true
Style/RbsInline/StructNewWithBlock:
  Enabled: true
Style/RbsInline/UnmatchedAnnotations:
  Enabled: true
Style/RbsInline/VariableCommentSpacing:
  Enabled: true

# YARD is bundled but off. A project that documents with YARD adds `YARD: Enabled: true` to its
# own .rubocop.yml. The department switch only holds while no YARD cop is named here, because
# RuboCop keeps a cop on when the same file both disables its department and enables the cop.
YARD:
  Enabled: false
