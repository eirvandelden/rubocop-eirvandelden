---
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-minitest
  - rubocop-obsession
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec
  - rubocop-yard

AllCops:
  NewCops: enable

  Exclude:
    - '**/app/assets/**/*'
    - '**/db/schema.rb'
    - '**/log/**/*'
    - '**/node_modules/**/*'
    - '**/public/**/*'
    - '**/storage/**/*'
    - '**/templates/**/*'
    - '**/tmp/**/*'
    - '**/vendor/**/*'
    - 'bin/**/*'

# rubocop-obsession loads rubocop-rspec whenever it can. Naming the department here keeps
# these rules off in the Minitest projects that would otherwise inherit all 115 of them.
RSpec:
  Enabled: false

# A test that walks a whole user journey earns several assertions; one with a dozen is a smell.
Minitest/MultipleAssertions:
  Max: 8

Layout/LineLength:
  Enabled: true
  Max: 120

# Routes and environment files are one long block by design, and a test block's size is
# already governed by how many assertions it makes.
Metrics/BlockLength:
  Enabled: true
  Exclude:
    - '**/config/environments/*.rb'
    - '**/config/routes.rb'
    - '**/test/**/*'

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: never

Minitest/UnreachableAssertion:
  Enabled: true

Performance/BindCall:
  Enabled: true
Performance/DeletePrefix:
  Enabled: true
Performance/DeleteSuffix:
  Enabled: true
Performance/EndWith:
  Enabled: true
Performance/FlatMap:
  Enabled: true
Performance/MapCompact:
  Enabled: true
Performance/RedundantMerge:
  Enabled: true
Performance/RegexpMatch:
  Enabled: true
Performance/ReverseEach:
  Enabled: true
Performance/SelectMap:
  Enabled: true
Performance/StartWith:
  Enabled: true
Performance/StringReplacement:
  Enabled: true
Performance/UnfreezeString:
  Enabled: true

# Rails advice lives in config/rails.yml. Every one of these cops suggests an ActiveSupport
# method, so in a plain Ruby project they autocorrect into a method that does not exist.
Rails:
  Enabled: false
Obsession/Rails:
  Enabled: false

YARD/CollectionStyle:
  Enabled: true
YARD/CollectionType:
  Enabled: true
YARD/MeaninglessTag:
  Enabled: true
YARD/MismatchName:
  Enabled: true
YARD/TagTypeSyntax:
  Enabled: true
YARD/TagTypePosition:
  Enabled: true
